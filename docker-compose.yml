services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lru-cache-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lru-cache-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
